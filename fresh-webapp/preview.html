<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodieNoms · Device preview</title>
  <link rel="stylesheet" href="./preview.css">
  <script defer src="./preview.js"></script>
</head>
<body>
  <header class="preview-toolbar">
    <div><strong>FoodieNoms</strong><span>Device preview</span></div>
    <div class="preview-controls">
      <label>Device<select id="device"><option value="iphone">iPhone · 393 × 852</option><option value="iphone-small">iPhone SE · 375 × 667</option><option value="ipad">iPad · 820 × 1180</option><option value="ipad-pro">iPad Pro · 1024 × 1366</option></select></label>
      <button id="rotate" type="button">Rotate</button>
      <label>Zoom<select id="zoom"><option value="fit">Fit to window</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label>
      <a href="./index.html" target="_blank" rel="noopener">Open app ↗</a>
    </div>
  </header>
  <main id="preview-stage"><div id="frame-space"><div id="device-frame" class="device-frame"><iframe id="app-preview" title="FoodieNoms app device preview" src="./index.html"></iframe></div></div></main>
  <footer><span id="dimensions">393 × 852 CSS pixels</span><span>Responsive browser preview · not an iOS simulator</span></footer>
</body>
</html>
