<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18543e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FoodieNoms">
  <meta name="description" content="FoodieNoms — discover, reserve and rescue delicious surplus food in Subang Jaya.">
  <title>FoodieNoms</title>
  <link rel="icon" href="./assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./data.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Please confirm</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions"><button value="cancel" class="button secondary">Keep reservation</button><button value="confirm" class="button primary">Cancel reservation</button></div>
    </form>
  </dialog>
  <noscript>FoodieNoms needs JavaScript enabled in your browser.</noscript>
</body>
</html>
