name: Build Android demo APK
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android runner and dependencies
        run: |
          flutter create --platforms=android --org com.foodienoms --project-name foodienoms --no-pub .
          flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Run Flutter tests
        run: |
          set +e
          flutter test --reporter expanded > /tmp/flutter-tests.log 2>&1
          result=$?
          cat /tmp/flutter-tests.log
          {
            printf '## Flutter test results\n\n```text\n'
            tail -c 24000 /tmp/flutter-tests.log
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PYTHON'
          from pathlib import Path
          text = Path('/tmp/flutter-tests.log').read_text()[-24000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Flutter test details::' + text)
          PYTHON
          fi
          exit "$result"
      - name: Build installable debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: FoodieNoms-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
