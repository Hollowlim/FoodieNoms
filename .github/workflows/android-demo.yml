name: Build Android demo APK
on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare Android runner and dependencies
        run: |
          flutter create --platforms=android --org com.foodienoms --project-name foodienoms --no-pub .
          flutter pub get
      - name: Analyze Flutter source
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --reporter expanded
      - name: Build installable debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: FoodieNoms-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
